---
name: "Package Update Action"
permissions:
  contents: write
  pull-requests: write
on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  updater:
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout repo"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1

      - name: "Check for update"
        id: "check"
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          latest="$(gh api "repos/desktop-app/tg_owt/commits/master" --jq '.sha')"
          current="$(awk -F'"' '/rev = / {print $2; exit}' default.nix)"
          current_version="$(awk -F'"' '/version = / {print $2; exit}' default.nix)"
          commit_date="$(gh api "repos/desktop-app/tg_owt/commits/${latest}" --jq '.commit.committer.date' | cut -dT -f1)"

          echo "Current rev: $current"
          echo "Latest rev: $latest"
          echo "Commit date: $commit_date"

          echo "current-version=$current_version" >> "$GITHUB_OUTPUT"
          echo "rev=$latest" >> "$GITHUB_OUTPUT"
          echo "date=$commit_date" >> "$GITHUB_OUTPUT"

          if [ "$latest" = "$current" ]; then
            echo "update=false" >> "$GITHUB_OUTPUT"
          else
            echo "update=true" >> "$GITHUB_OUTPUT"
          fi

      - name: "Install Nix"
        if: steps.check.outputs.update == 'true'
        uses: "cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9" # v32.0.0
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: "Update flake.lock"
        if: steps.check.outputs.update == 'true'
        uses: "./.github/actions/update-flake-lock"

      - name: "Update package"
        if: steps.check.outputs.update == 'true'
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          set -euo pipefail
          latest="${{ steps.check.outputs.rev }}"
          commit_date="${{ steps.check.outputs.date }}"

          hash="$(nix run nixpkgs#nix-prefetch-github -- desktop-app tg_owt --rev "${latest}" --fetch-submodules --json | jq -r .hash)"

          sed -i "s|rev = \".*\";|rev = \"${latest}\";|" default.nix
          sed -i "s|hash = \".*\";|hash = \"${hash}\";|" default.nix
          sed -i "s|version = \".*\";|version = \"0-unstable-${commit_date}\";|" default.nix

          echo "Updated to ${latest} (${commit_date}), hash=${hash}"

      - name: "Verify build"
        if: steps.check.outputs.update == 'true'
        run: nix build

      - name: "Read package version"
        if: steps.check.outputs.update == 'true'
        id: "version"
        run: |
          echo "value=$(nix eval --raw .#tg_owt.version)" >> "$GITHUB_OUTPUT"

      # github-actions[bot] PRs need manual workflow approval, an app token does not
      - name: "Create app token"
        if: steps.check.outputs.update == 'true'
        id: "app-token"
        uses: "./.github/actions/create-app-token"
        with:
          client-id: "${{ secrets.APP_CLIENT_ID }}"
          private-key: "${{ secrets.APP_PRIVATE_KEY }}"

      - name: "Create pull request"
        if: steps.check.outputs.update == 'true'
        id: "pr"
        uses: "peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1" # v8.1.3
        with:
          token: "${{ steps.app-token.outputs.token }}"
          branch: "update-tg_owt"
          delete-branch: true
          add-paths: |
            default.nix
            flake.lock
          commit-message: "feat: ${{ steps.check.outputs.current-version }}->${{ steps.version.outputs.value }}"
          title: "feat: ${{ steps.check.outputs.current-version }}->${{ steps.version.outputs.value }}"
          body: |
            Automated update of `tg_owt` to [`${{ steps.check.outputs.rev }}`](https://github.com/desktop-app/tg_owt/commit/${{ steps.check.outputs.rev }}).

            Version and source hash were bumped with `nix-prefetch-github`.

      - name: "Enable auto-merge"
        if: "steps.pr.outputs.pull-request-number != ''"
        run: |
          gh pr merge ${{ steps.pr.outputs.pull-request-number }} \
            --auto \
            --squash
        env:
          GITHUB_TOKEN: "${{ steps.app-token.outputs.token }}"
