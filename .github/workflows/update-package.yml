---
name: "Package Update Action"
run-name: "npu"
permissions:
  contents: write
  pull-requests: write
on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  updater:
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout repo"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1

      - name: "Check for update"
        id: "check"
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          latest="$(gh api "repos/desktop-app/tg_owt/commits/master" --jq '.sha')"
          current="$(awk -F'"' '/rev = / {print $2; exit}' default.nix)"
          current_version="$(awk -F'"' '/version = / {print $2; exit}' default.nix)"

          echo "Current rev: $current"
          echo "Latest rev: $latest"
          echo "current-version=$current_version" >> "$GITHUB_OUTPUT"

          if [ "$latest" = "$current" ]; then
            echo "update=false" >> "$GITHUB_OUTPUT"
          else
            echo "update=true" >> "$GITHUB_OUTPUT"
          fi
          echo "rev=$latest" >> "$GITHUB_OUTPUT"

      - name: "Install Nix"
        if: steps.check.outputs.update == 'true'
        uses: "cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b" # v31.11.3
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: "Update package"
        if: steps.check.outputs.update == 'true'
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |-
          nix run nixpkgs#nix-update -- \
            --flake \
            --version=branch \
            --override-filename default.nix \
            tg_owt

      - name: "Read package version"
        if: steps.check.outputs.update == 'true'
        id: "version"
        run: |-
          echo "value=$(nix eval --raw .#tg_owt.version)" >> "$GITHUB_OUTPUT"

      - name: "Create pull request"
        if: steps.check.outputs.update == 'true'
        id: "pr"
        uses: "peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1" # v8.1.1
        with:
          branch: "update-tg_owt"
          delete-branch: true
          add-paths: "default.nix"
          commit-message: "tg_owt: ${{ steps.check.outputs.current-version }} -> ${{ steps.version.outputs.value }}"
          title: "tg_owt: ${{ steps.check.outputs.current-version }} -> ${{ steps.version.outputs.value }}"
          body: |-
            Automated update of `tg_owt` to [`${{ steps.check.outputs.rev }}`](https://github.com/desktop-app/tg_owt/commit/${{ steps.check.outputs.rev }}).

            Version and source hash were bumped with [nix-update](https://github.com/Mic92/nix-update).

      - name: "Enable auto-merge"
        if: "steps.pr.outputs.pull-request-number != ''"
        run: |
          gh pr merge ${{ steps.pr.outputs.pull-request-number }} \
            --auto \
            --squash
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
